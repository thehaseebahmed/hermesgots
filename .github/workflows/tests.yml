name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which of the three gates this event can have changed. Every gate runs when the answer can't be
  # worked out: a detection that quietly gave up would leave a required check reporting Success
  # without the work behind it.
  #
  # The gates read this job's outputs and are skipped by a condition, which reports Success — the
  # rule that keeps branch protection satisfied. `paths:` on the workflow would instead leave a
  # required check pending forever, so the filtering lives inside the jobs.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      plugin: ${{ steps.filter.outputs.plugin }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the base commit is there to diff against.
          fetch-depth: 0

      - name: Diff against the base
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          areas=$(bash "$GITHUB_WORKSPACE/.github/scripts/changed-areas.sh" "$BASE" "$HEAD")
          app=false plugin=false website=false
          while IFS= read -r area; do
            case "$area" in
              app) app=true ;;
              plugin) plugin=true ;;
              website) website=true ;;
            esac
          done <<< "$areas"
          {
            echo "app=$app"
            echo "plugin=$plugin"
            echo "website=$website"
          } >> "$GITHUB_OUTPUT"
          echo "app=$app plugin=$plugin website=$website"

  plugin:
    name: Plugin tests
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the plugin's test dependencies
        run: python3 -m pip install cryptography
      - name: Run the plugin tests
        run: python3 -m unittest discover -s plugin/tests

  app:
    name: App gates
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # The pnpm store, so an install is a link rather than a fresh download every run.
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: app
      - name: Lint
        run: pnpm lint
        working-directory: app
      - name: Typecheck
        run: pnpm typecheck
        working-directory: app
      - name: Community function tests
        run: node scripts/test-community.mjs
        working-directory: app
      - name: BenchLM matching tests
        run: node --experimental-strip-types --test scripts/test-bench-matching.mjs scripts/test-benchlm-check.mjs
        working-directory: app
      - name: Identity session tests
        run: node --experimental-strip-types --test scripts/test-identity-session.mjs
        working-directory: app
      - name: Build
        run: pnpm build
        working-directory: app

  website:
    name: Website build
    needs: changes
    # Netlify builds this site on a merge, so the gate is for pull requests: main's run would pay
    # for a second copy of a build the deploy already does.
    if: github.event_name == 'pull_request' && needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: website
      - name: Typecheck and build
        run: pnpm build
        working-directory: website