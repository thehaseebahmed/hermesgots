name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Plugin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the plugin's test dependencies
        run: python3 -m pip install cryptography
      - name: Run the plugin tests
        run: python3 -m unittest discover -s plugin/tests

  app:
    name: App gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: app
      - name: Lint
        run: pnpm lint
        working-directory: app
      - name: Typecheck
        run: pnpm typecheck
        working-directory: app
      - name: Community function tests
        run: node scripts/test-community.mjs
        working-directory: app
      - name: BenchLM matching tests
        run: node --experimental-strip-types --test scripts/test-bench-matching.mjs
        working-directory: app
      - name: Build
        run: pnpm build
        working-directory: app

  website:
    name: Website build
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: website
      - name: Typecheck and build
        run: pnpm build
        working-directory: website
