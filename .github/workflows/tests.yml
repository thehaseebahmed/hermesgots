name: Tests

on:
  pull_request:
  # Pushes to main that reach production are gated by Deploy, which calls this workflow. These paths
  # are the rest: the areas this workflow's own `changes` job answers for, plus any CI change, which
  # `.github/scripts/changed-areas.sh` answers with every area — minus the one file Deploy's trigger
  # owns, so a push is tested by one run or the other rather than by both.
  push:
    branches: [main]
    paths:
      - "plugin/**"
      - "website/**"
      - ".github/**"
      - "!.github/workflows/deploy.yml"
  workflow_call:
    inputs:
      concurrency_suffix:
        description: "Appended to the concurrency group so a call from another workflow doesn't cancel that workflow's own run, or the run it was called for, when one push starts both."
        type: string
        default: ""

concurrency:
  group: tests-${{ github.ref }}${{ inputs.concurrency_suffix }}
  cancel-in-progress: true

jobs:
  # Which of the three gates this event can have changed. Every gate runs when the answer can't be
  # worked out: a detection that quietly gave up would leave a required check reporting Success
  # without the work behind it.
  #
  # The gates read this job's outputs and are skipped by a condition, which reports Success — the
  # rule that keeps branch protection satisfied. `paths:` on the workflow would instead leave a
  # required check pending forever, so the filtering lives inside the jobs.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      plugin: ${{ steps.filter.outputs.plugin }}
      website: ${{ steps.filter.outputs.website }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the base commit is there to diff against.
          fetch-depth: 0

      - name: Diff against the base
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          areas=$(bash "$GITHUB_WORKSPACE/.github/scripts/changed-areas.sh" "$BASE" "$HEAD")
          app=false plugin=false website=false ci=false
          while IFS= read -r area; do
            case "$area" in
              app) app=true ;;
              plugin) plugin=true ;;
              website) website=true ;;
              ci) ci=true ;;
            esac
          done <<< "$areas"
          {
            echo "app=$app"
            echo "plugin=$plugin"
            echo "website=$website"
            echo "ci=$ci"
          } >> "$GITHUB_OUTPUT"
          echo "app=$app plugin=$plugin website=$website ci=$ci"

  plugin:
    name: Plugin tests
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the plugin's test dependencies
        run: python3 -m pip install cryptography
      - name: Run the plugin tests
        run: bash .github/scripts/checks.sh plugin

  app:
    name: App gates
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # The pnpm store, so an install is a link rather than a fresh download every run.
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      # The gates live in `.github/scripts/checks.sh`, which the development image's verification
      # runs too: one list, so a gate added for the runner reaches the image as well.
      - name: App gates
        run: bash .github/scripts/checks.sh app

      # Deploy publishes this exact build, so it is uploaded for anything but a pull request: a push's
      # candidate deploy and a hand-run promotion both download it, and a release's publish runs as a
      # hand-run of Deploy — the upload is what makes that download possible.
      - name: Upload the build for the deploy
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: app-dist
          path: app/dist
          if-no-files-found: error

  # The CI's own logic: the release decision `.github/workflows/release.yml` calls. `.github/**` answers
  # every area, so this runs on any pull request that can have touched it.
  ci:
    name: CI checks
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: CI checks
        run: bash .github/scripts/checks.sh ci

  website:
    name: Website build
    needs: changes
    # Netlify builds this site on a merge, so the gate is for pull requests: main's run would pay
    # for a second copy of a build the deploy already does.
    if: github.event_name == 'pull_request' && needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Typecheck and build
        run: bash .github/scripts/checks.sh website
