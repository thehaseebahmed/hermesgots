name: Android release

# The signed release APK for a release: a dated tag on main (`v2026.09.17`, cut by `release.yml`), or
# by hand on such a tag. The tag names the release; the APK's version name comes from
# `app/package.json` and its version code from that version, because the tag is a date and the app
# carries its own version (`docs/adr/0004-a-release-is-a-dated-tag-on-main.md`).
#
# A release that didn't move the app builds no APK: its version code would be the one the previous
# release's APK already carried, and a build that repeats it can't install over that one.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}

permissions:
  contents: write

jobs:
  # The release's tag, and whether the release moved the app. The tag is the pushed one, or — for a
  # hand-run — the newest release tag on the head commit.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      app: ${{ steps.describe.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: the previous release's tag is what "moved" is measured against.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          # `release.mjs describe` runs on Node, pinned as CI pins it.
          node-version: 22

      - name: The release's tag
        id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          release='^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
          else
            git fetch --quiet --depth=1 origin '+refs/tags/*:refs/tags/*' || true
            tag=$(git tag --points-at HEAD | grep -E "$release" | sort | tail -n1 || true)
          fi
          if [ -z "$tag" ]; then
            echo "::error::$REF_NAME has no release tag on its head commit. A release is a dated tag on main, cut by the Release workflow."
            exit 1
          fi
          if ! grep -Eq "$release" <<< "$tag"; then
            echo "::error::$tag isn't a release tag: a release is dated, like v2026.09.17"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"

      - name: What this release moved
        id: describe
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # The release's own decision, so what publishes the app and what is built here agree.
          node .github/scripts/release.mjs describe --tag "$TAG"

  release:
    name: Build the release APK
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      FIREBASE_GOOGLE_SERVICES: ${{ secrets.FIREBASE_GOOGLE_SERVICES }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          # The tag's own commit, not a branch head that may have moved past it.
          ref: ${{ needs.changes.outputs.tag }}

      - name: Version from the app
        id: version
        env:
          TAG: ${{ needs.changes.outputs.tag }}
        run: |
          name=$(node -p "require('./package.json').version")
          if ! grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' <<< "$name"; then
            echo "::error::app/package.json's version ($name) isn't a version like 0.1.0 or 0.1.0-beta.1"
            exit 1
          fi
          core="${name%%-*}"
          IFS=. read -r major minor patch <<< "$core"
          if [ "$minor" -gt 99 ] || [ "$patch" -gt 99 ]; then
            echo "::error::minor and patch must be 99 or less to fit the version code"
            exit 1
          fi
          # Each release must have a higher version code than the last. A prerelease takes its
          # trailing number (beta.3 is 3, up to 98) and the release itself 99, so 1.2.3-beta.1 <
          # 1.2.3-beta.2 < 1.2.3 < 1.2.4-beta.1.
          if [ "$name" = "$core" ]; then
            stage=99
          else
            stage=$(grep -Eo '[0-9]+$' <<< "${name#*-}" || echo 0)
            stage=$((10#$stage > 98 ? 98 : 10#$stage))
          fi
          code=$((10#$major * 1000000 + 10#$minor * 10000 + 10#$patch * 100 + stage))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "ANDROID_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "Building $name (version code $code) from $TAG"

      - name: Signing key
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [ -z "$KEYSTORE_BASE64" ] && missing+=(ANDROID_KEYSTORE_BASE64)
          [ -z "$ANDROID_KEYSTORE_PASSWORD" ] && missing+=(ANDROID_KEYSTORE_PASSWORD)
          [ -z "$ANDROID_KEY_ALIAS" ] && missing+=(ANDROID_KEY_ALIAS)
          [ -z "$ANDROID_KEY_PASSWORD" ] && missing+=(ANDROID_KEY_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::A release needs these secrets, which aren't set: ${missing[*]} (see the README's Android app section)"
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - name: Build web assets and sync them into the Android project
        # A release build points at production: this is the app users install, not a tester's.
        run: pnpm build:android
        env:
          VITE_SITE_URL: ${{ vars.MEMENTO_SITE_URL }}

      - name: Firebase config
        if: env.FIREBASE_GOOGLE_SERVICES != ''
        run: |
          # The secret is the file's JSON, either as is or base64-encoded.
          out=android/app/google-services.json
          printf '%s' "$FIREBASE_GOOGLE_SERVICES" | tr -d '\r' > "$RUNNER_TEMP/firebase.raw"
          if jq -e . "$RUNNER_TEMP/firebase.raw" > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/firebase.raw" "$out"
          elif tr -d ' \n' < "$RUNNER_TEMP/firebase.raw" | base64 --decode > "$out" 2> /dev/null && jq -e . "$out" > /dev/null 2>&1; then
            :
          else
            rm -f "$out"
            echo "::error::FIREBASE_GOOGLE_SERVICES is neither the JSON of google-services.json nor its base64 ($(wc -c < "$RUNNER_TEMP/firebase.raw") bytes, first byte $(head -c1 "$RUNNER_TEMP/firebase.raw" | od -An -tx1 | tr -d ' '))"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/firebase.raw"
          # The package moved from app.memento to app.gots. google-services.json without a client for the
          # new package fails the Gradle plugin, so such a build ships with push off until the secret is
          # updated with the new Firebase app.
          if ! jq -e '.client[]? | select(.client_info.android_client_info.package_name == "app.gots")' "$out" > /dev/null 2>&1; then
            rm -f "$out"
            echo "::warning::FIREBASE_GOOGLE_SERVICES has no app.gots client, so this build has push off. Register app.gots in Firebase and update the secret."
          fi

      - name: Build signed release APK
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          status=0
          ./gradlew assembleRelease --no-daemon || status=$?
          rm -f "$ANDROID_KEYSTORE_PATH"
          exit $status

      - name: Name the APK
        id: apk
        run: |
          out="$RUNNER_TEMP/memento-${{ steps.version.outputs.name }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      # Kept for releases: a build can be pulled from the run without the Release page.
      - uses: actions/upload-artifact@v7
        with:
          name: memento-${{ steps.version.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # The Release workflow writes this release's page and then dispatches this one, so the upload
      # path is the usual one; a tag pushed by hand has no page yet, and gets one here.
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.changes.outputs.tag }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "$TAG" --generate-notes --verify-tag
          fi
