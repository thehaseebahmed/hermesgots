name: Theseus skill

on:
  pull_request:
    paths:
      - "plugin/skills/**"
      - "app/scripts/sync-theseus.mjs"
      - ".github/workflows/theseus.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    # The vendored skill is only ever changed by pnpm sync:theseus, never by hand.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node app/scripts/sync-theseus.mjs --check

  bump:
    # Weekly: when agent-skills' main has moved past the vendored commit, open a PR that vendors it.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: bump
        run: |
          before=$(node -p "require('./plugin/skills/VENDORED.json').commit")
          node app/scripts/sync-theseus.mjs --ref main
          after=$(node -p "require('./plugin/skills/VENDORED.json').commit")
          echo "changed=$([ "$before" != "$after" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "commit=${after:0:12}" >> "$GITHUB_OUTPUT"
      - if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "chore/theseus-${{ steps.bump.outputs.commit }}"
          git add plugin/skills
          git commit -m "chore(deps): vendor tha-theseus ${{ steps.bump.outputs.commit }}"
          git push -u origin HEAD
          gh pr create --title "chore(deps): vendor tha-theseus ${{ steps.bump.outputs.commit }}" \
            --body "Vendors the latest tha-theseus from thehaseebahmed/agent-skills. Check that the skill's \`api\` in plugin/skills/VENDORED.json is still the one the plugin speaks, then bump the plugin version." 
        env:
          GH_TOKEN: ${{ github.token }}
