name: Android

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/android.yml"
  # Builds any branch on demand; when Firebase is set up it also goes to the testers.
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Fork PRs get no secrets; they fall back to a debug build.
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      FIREBASE_GOOGLE_SERVICES: ${{ secrets.FIREBASE_GOOGLE_SERVICES }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_DISTRIBUTION_KEY }}
      # Name the build after the PR's head, not the merge commit Actions checks out.
      COMMIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - name: Build web assets and sync them into the Android project
        run: pnpm build:android
        env:
          VITE_SITE_URL: ${{ vars.MEMENTO_SITE_URL }}

      - name: Firebase config
        if: env.FIREBASE_GOOGLE_SERVICES != ''
        run: |
          # The secret is the file's JSON, either as is or base64-encoded.
          out=android/app/google-services.json
          printf '%s' "$FIREBASE_GOOGLE_SERVICES" | tr -d '\r' > "$RUNNER_TEMP/firebase.raw"
          if jq -e . "$RUNNER_TEMP/firebase.raw" > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/firebase.raw" "$out"
          elif tr -d ' \n' < "$RUNNER_TEMP/firebase.raw" | base64 --decode > "$out" 2> /dev/null && jq -e . "$out" > /dev/null 2>&1; then
            :
          else
            rm -f "$out"
            echo "::error::FIREBASE_GOOGLE_SERVICES is neither the JSON of google-services.json nor its base64 ($(wc -c < "$RUNNER_TEMP/firebase.raw") bytes, first byte $(head -c1 "$RUNNER_TEMP/firebase.raw" | od -An -tx1 | tr -d ' '))"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/firebase.raw"

      - name: Version
        id: version
        run: |
          sha="${COMMIT_REF::7}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ANDROID_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=$(node -p 'require("./package.json").version')-$sha" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.KEYSTORE_BASE64 != ''
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          ./gradlew assembleRelease --no-daemon
          rm -f "$ANDROID_KEYSTORE_PATH"

      - name: Build debug APK
        if: env.KEYSTORE_BASE64 == ''
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: memento-${{ steps.version.outputs.sha }}
          path: app/android/app/build/outputs/apk/*/*.apk
          if-no-files-found: error

      # Pull requests never reach testers, and an unsigned build would not update over a signed one.
      - name: Distribute to testers with Firebase App Distribution
        if: github.event_name != 'pull_request' && env.KEYSTORE_BASE64 != '' && env.FIREBASE_SERVICE_ACCOUNT != ''
        env:
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'testers' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Without an explicit id, take the app.memento app's id from google-services.json.
          app_id="$FIREBASE_APP_ID"
          if [ -z "$app_id" ] && [ -f android/app/google-services.json ]; then
            app_id=$(jq -r '[.client[] | select(.client_info.android_client_info.package_name == "app.memento") | .client_info.mobilesdk_app_id][0] // empty' android/app/google-services.json)
          fi
          if [ -z "$app_id" ]; then
            echo "::error::Set the FIREBASE_APP_ID variable, or the FIREBASE_GOOGLE_SERVICES secret with an app.memento client"
            exit 1
          fi
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-distribution.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          if ! jq -e . "$GOOGLE_APPLICATION_CREDENTIALS" > /dev/null 2>&1; then
            base64 --decode <<< "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS" 2> /dev/null || true
          fi
          if ! jq -e .client_email "$GOOGLE_APPLICATION_CREDENTIALS" > /dev/null 2>&1; then
            rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not a service account key's JSON or its base64"
            exit 1
          fi
          notes="$RUNNER_TEMP/release-notes.txt"
          { echo "$ANDROID_VERSION_NAME ($REF_NAME)"; echo; git log -1 --format=%B "$GITHUB_SHA"; } > "$notes"
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          status=0
          npx --yes firebase-tools@15.31.0 appdistribution:distribute "$apk" \
            --app "$app_id" --groups "$FIREBASE_TESTER_GROUPS" --release-notes-file "$notes" || status=$?
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
          exit $status
