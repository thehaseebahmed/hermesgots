name: Android

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Whether the native project itself moved. A pull request that only touches the app's TypeScript
  # gets the static checks; packaging an APK is what main pays for, since only a push distributes it.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so the base commit is there to diff against.
          fetch-depth: 0

      - name: Diff against the base
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          areas=$(bash "$GITHUB_WORKSPACE/.github/scripts/changed-areas.sh" "$BASE" "$HEAD")
          native=false
          while IFS= read -r area; do
            if [ "$area" = native ]; then native=true; fi
          done <<< "$areas"
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "native=$native"

  apk:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Debug builds are signed with the release key when there is one, so each tester build
      # updates over the last. Fork PRs get no secrets and use the runner's own debug key.
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      FIREBASE_GOOGLE_SERVICES: ${{ secrets.FIREBASE_GOOGLE_SERVICES }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      # Name the build after the PR's head, not the merge commit Actions checks out.
      COMMIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - run: pnpm install --frozen-lockfile

      # `pnpm lint` is not repeated here: it covers `app/src`, which `tests.yml`'s App gates job lints
      # whenever the diff includes it, and a native-only diff — what this job mostly builds — has no
      # app source in it to lint.

      - name: Firebase config
        if: env.FIREBASE_GOOGLE_SERVICES != ''
        run: |
          # The secret is the file's JSON, either as is or base64-encoded.
          out=android/app/google-services.json
          printf '%s' "$FIREBASE_GOOGLE_SERVICES" | tr -d '\r' > "$RUNNER_TEMP/firebase.raw"
          if jq -e . "$RUNNER_TEMP/firebase.raw" > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/firebase.raw" "$out"
          elif tr -d ' \n' < "$RUNNER_TEMP/firebase.raw" | base64 --decode > "$out" 2> /dev/null && jq -e . "$out" > /dev/null 2>&1; then
            :
          else
            rm -f "$out"
            echo "::error::FIREBASE_GOOGLE_SERVICES is neither the JSON of google-services.json nor its base64 ($(wc -c < "$RUNNER_TEMP/firebase.raw") bytes, first byte $(head -c1 "$RUNNER_TEMP/firebase.raw" | od -An -tx1 | tr -d ' '))"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/firebase.raw"

      - name: Build web assets and sync them into the Android project
        run: |
          # Push only works in a build that carries google-services.json.
          if [ -f android/app/google-services.json ]; then export VITE_FIREBASE=1; fi
          pnpm build:android
        env:
          # A tester build signs in and syncs through the candidate deploy of the newest merge; the
          # release build (android-release.yml) points at production. `candidate--` only resolves on
          # the site's netlify.app host, so the candidate URL is a variable of its own rather than
          # MEMENTO_SITE_URL with a prefix — its primary URL is a custom domain, and no branch-deploy
          # URL can be built from one. Unset, this falls back to production rather than building a
          # tester app with no sync at all.
          VITE_SITE_URL: ${{ vars.MEMENTO_CANDIDATE_URL || vars.MEMENTO_SITE_URL }}

      - name: Version
        run: |
          sha="${COMMIT_REF::7}"
          echo "ANDROID_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=$(node -p 'require("./package.json").version')-$sha" >> "$GITHUB_ENV"

      # One Gradle invocation for both: a daemon-less run pays its startup and configuration cost
      # each time, so the static check and the packaging build share one.
      - name: Gradle checks
        working-directory: app/android
        env:
          EVENT: ${{ github.event_name }}
          NATIVE_CHANGED: ${{ needs.changes.outputs.native }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # A pull request touching only the app's TypeScript is checked, not packaged; anything on
          # main is packaged, because that is the build Firebase distributes to testers.
          tasks=lintDebug
          if [ "$EVENT" = "push" ] || [ "$NATIVE_CHANGED" = "true" ]; then
            tasks="$tasks assembleDebug"
            if [ -n "$KEYSTORE_BASE64" ]; then
              export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
              echo "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
            fi
          fi
          status=0
          ./gradlew $tasks --no-daemon || status=$?
          rm -f "$RUNNER_TEMP/release.keystore"
          exit $status

      # Only what lands on main reaches testers, and only with a stable key, or each build
      # would refuse to install over the last.
      - name: Distribute to testers with Firebase App Distribution
        if: github.event_name == 'push' && env.KEYSTORE_BASE64 != '' && env.FIREBASE_SERVICE_ACCOUNT != ''
        env:
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'testers' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Without an explicit id, take the app.memento app's id from google-services.json.
          app_id="$FIREBASE_APP_ID"
          if [ -z "$app_id" ] && [ -f android/app/google-services.json ]; then
            app_id=$(jq -r '[.client[] | select(.client_info.android_client_info.package_name == "app.memento") | .client_info.mobilesdk_app_id][0] // empty' android/app/google-services.json)
          fi
          if [ -z "$app_id" ]; then
            echo "::error::Set the FIREBASE_APP_ID variable, or the FIREBASE_GOOGLE_SERVICES secret with an app.memento client"
            exit 1
          fi
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-distribution.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          if ! jq -e . "$GOOGLE_APPLICATION_CREDENTIALS" > /dev/null 2>&1; then
            base64 --decode <<< "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS" 2> /dev/null || true
          fi
          if ! jq -e .client_email "$GOOGLE_APPLICATION_CREDENTIALS" > /dev/null 2>&1; then
            rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not a service account key's JSON or its base64"
            exit 1
          fi
          notes="$RUNNER_TEMP/release-notes.txt"
          { echo "$ANDROID_VERSION_NAME ($REF_NAME)"; echo; git log -1 --format=%B "$GITHUB_SHA"; } > "$notes"
          apk=$(ls android/app/build/outputs/apk/debug/*.apk | head -n1)
          status=0
          npx --yes firebase-tools@15.31.0 appdistribution:distribute "$apk" \
            --app "$app_id" --groups "$FIREBASE_TESTER_GROUPS" --release-notes-file "$notes" || status=$?
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
          exit $status
