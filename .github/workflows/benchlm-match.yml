name: BenchLM id check

on:
  schedule:
    # Weekly, not daily: the ids move when BenchLM's own data does, the check edits one issue in
    # place, and it gates nothing.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  # The payload the app ships is committed, so the refresh below writes to the repository.
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: app
      # The scores the app ships are a committed file, so this is where they are kept fresh: one
      # fetch of the overall surface, validated and written, and committed only when it moved.
      - name: Refresh the shipped rankings
        env:
          BENCHLM_DATA_KEY: ${{ secrets.BENCHLM_DATA_KEY }}
        run: node --experimental-strip-types scripts/build-rankings.mjs
        working-directory: app
      - name: Commit the refreshed payload
        working-directory: app
        run: |
          if git diff --quiet -- src/lib/rankings-data.ts; then
            echo "BenchLM's surface is the one already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/rankings-data.ts
          git commit -m "chore(rankings): refresh the BenchLM payload"
          git push
      - name: Check model ids against BenchLM
        id: check
        run: node --experimental-strip-types scripts/check-benchlm-matches.mjs --report "$RUNNER_TEMP/benchlm-report.json"
        working-directory: app
        continue-on-error: true
      - name: Open or update issue
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ runner.temp }}/benchlm-report.json
        with:
          script: |
            const fs = require("fs")
            // The check writes its report only once models.dev answered, so a missing file is a
            // fetch that failed — say so instead of failing to parse.
            let report
            try {
              report = JSON.parse(fs.readFileSync(process.env.REPORT, "utf8"))
            } catch {
              report = null
            }
            const title = "BenchLM: unmatched model ids"
            const lines = report
              ? [
                  `Checked ${report.checkedAt}. BenchLM data as of ${report.benchlmDataAsOf}.`,
                  "",
                  "Unlisted unmatched ids (add a fix in model-match.ts or a reason in scripts/benchlm-known-gaps.json):",
                  ...report.failing.map((id) => `- ${id}`),
                ]
              : ["The check wrote no report, so models.dev could not be read. See the job log."]
            const body = lines.join("\n")
            const { data: found } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open label:benchlm-match in:title "${title}"`,
            })
            const existing = found.items.find((i) => i.title === title)
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body })
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ["benchlm-match"] })
            }
      - name: Fail the job
        if: steps.check.outcome == 'failure'
        run: exit 1
