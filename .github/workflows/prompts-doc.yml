name: Prompts doc

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "plugin/prompt_builder.py"
      - "plugin/dictation.py"
      - "plugin/dictation_cleanup.py"
      - "plugin/scripts/generate_prompts_doc.py"

concurrency:
  group: prompts-doc-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    # A prompt module or the generator moved: rebuild docs/prompts.md and open a PR when the doc
    # changed, so the readable copy of every prompt — a session's and dictation's — never goes
    # stale.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The plugin package's __init__ pulls in push.py, so the generator needs cryptography.
      - name: Install the plugin's dependencies
        run: python3 -m pip install cryptography
      - id: generate
        run: |
          python3 plugin/scripts/generate_prompts_doc.py
          if [ -z "$(git status --porcelain -- docs/prompts.md)" ]; then
            echo "docs/prompts.md is up to date; nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.generate.outputs.changed == 'true'
        run: |
          body="## Summary

          Regenerated docs/prompts.md from the current plugin modules: every prompt a project
          session's run can be injected with, and the ones dictation's transcription and cleanup
          send to a model, in one readable file.

          ## Changes

          - docs/prompts.md regenerated by the Prompts doc workflow.

          ## How to test

          1. python3 plugin/scripts/generate_prompts_doc.py writes the same file."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "docs/prompts-${GITHUB_SHA:0:7}"
          git add docs/prompts.md
          git commit -m "docs: regenerate the prompts doc"
          git push -u origin HEAD
          gh pr create --title "docs: regenerate the prompts doc" --body "$body"
        env:
          GH_TOKEN: ${{ github.token }}
