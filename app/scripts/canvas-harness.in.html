<!DOCTYPE html>
<!--
  The page a canvas's draft is checked in (ADR 0171), generated by
  `app/scripts/build-canvas-harness.mjs` from the app's own frame code — the document builder, the
  class compile and the library sources — with the app's own theme tokens under it. A plugin is
  installed without the repository, so the artifact travels with it, and `test-canvas-harness.mjs`
  holds it to this render: a library update, or a change to the frame code, regenerates it.

  The page is the harness's own: it draws nothing until the plugin's runner hands it a document, a
  read-only snapshot of the canvas's data and the tests a build filed. `window.canvasHarness.check`
  is what the runner calls, once per width and mode.
-->
<html>
<head>
<meta charset="utf-8">
<title>canvas check</title>
<style>
/*
 * The app's own tokens, so this page reads them the way the app reads its own theme
 * (`getComputedStyle(document.documentElement)` in routes/canvas.tsx): `:root` for the light mode
 * and `.dark` for the dark one, which `check` toggles on this document's own element.
 */
{{tokens}}
html,
body {
  margin: 0;
  padding: 0;
}

iframe {
  border: 0;
  display: block;
  width: 100vw;
  height: 100vh;
}
</style>
</head>
<body>
<script>
{{bundle}}
</script>
</body>
</html>
