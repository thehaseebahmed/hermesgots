<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" width="1040" height="660" role="img" aria-labelledby="uml-title uml-desc">
  <title id="uml-title">Gots deployment diagram</title>
  <desc id="uml-desc">A UML deployment diagram. Your phone or tablet is a device running the Gots app component. Your computer or server is a node running Hermes Agent and the Gots plugin. Gots' sync server is an optional node offering sign-in and an encrypted store. The app chats with and controls the Host; it signs in and syncs through the sync server, which only ever holds encrypted data.</desc>

  <defs>
    <marker id="open-blue" viewBox="0 0 14 14" refX="14" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 1 1 L 14 7 L 1 13" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="open-violet" viewBox="0 0 14 14" refX="14" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 1 1 L 14 7 L 1 13" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- Frame -->
    <rect x="20" y="20" width="1000" height="620" fill="none" stroke="#94a3b8" stroke-width="1.25"/>
    <path d="M20 20 H200 V46 H182 L170 58 H20 Z" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/>
    <text x="34" y="41" font-size="12.5" font-weight="600" fill="#334155">deployment  Gots</text>

    <!-- Node A: the device -->
    <path d="M60 120 L80 100 L380 100 L360 120 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M360 120 L380 100 L380 250 L360 270 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="60" y="120" width="300" height="150" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="78" y="144" font-size="10.5" font-style="italic" fill="#1e40af">&#171;device&#187;</text>
    <text x="78" y="166" font-size="14" font-weight="700" fill="#0f172a">Your phone or tablet</text>
    <rect x="80" y="188" width="260" height="52" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.25"/>
    <rect x="104" y="204" width="26" height="20" rx="2" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="98" y="208" width="10" height="5" rx="1.5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="98" y="216" width="10" height="5" rx="1.5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="146" y="219" font-size="12" font-weight="600" fill="#0f172a">Gots app</text>

    <!-- Node B: the Host -->
    <path d="M680 120 L700 100 L1000 100 L980 120 Z" fill="#d1fae5" stroke="#059669" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M980 120 L1000 100 L1000 250 L980 270 Z" fill="#d1fae5" stroke="#059669" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="680" y="120" width="300" height="150" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="698" y="144" font-size="10.5" font-style="italic" fill="#047857">&#171;node&#187;</text>
    <text x="698" y="166" font-size="14" font-weight="700" fill="#0f172a">Your computer or server</text>
    <rect x="700" y="186" width="260" height="34" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.25"/>
    <rect x="724" y="193" width="24" height="20" rx="2" fill="none" stroke="#059669" stroke-width="1.5"/>
    <rect x="718" y="197" width="9" height="5" rx="1.5" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <rect x="718" y="205" width="9" height="5" rx="1.5" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="764" y="208" font-size="12" font-weight="600" fill="#0f172a">Hermes Agent</text>
    <rect x="700" y="228" width="260" height="34" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.25"/>
    <rect x="724" y="235" width="24" height="20" rx="2" fill="none" stroke="#059669" stroke-width="1.5"/>
    <rect x="718" y="239" width="9" height="5" rx="1.5" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <rect x="718" y="247" width="9" height="5" rx="1.5" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="764" y="250" font-size="12" font-weight="600" fill="#0f172a">Gots plugin</text>

    <!-- Node C: the sync server -->
    <path d="M60 430 L80 410 L380 410 L360 430 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M360 430 L380 410 L380 570 L360 590 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="60" y="430" width="300" height="160" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="78" y="454" font-size="10.5" font-style="italic" fill="#5b21b6">&#171;node&#187;</text>
    <text x="78" y="476" font-size="14" font-weight="700" fill="#0f172a">Gots' sync server</text>
    <rect x="80" y="498" width="260" height="34" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.25"/>
    <rect x="104" y="505" width="24" height="20" rx="2" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="98" y="509" width="9" height="5" rx="1.5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="98" y="517" width="9" height="5" rx="1.5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="144" y="520" font-size="12" font-weight="600" fill="#0f172a">Sign-in</text>
    <rect x="80" y="540" width="260" height="34" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.25"/>
    <rect x="104" y="547" width="24" height="20" rx="2" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="98" y="551" width="9" height="5" rx="1.5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="98" y="559" width="9" height="5" rx="1.5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="144" y="562" font-size="12" font-weight="600" fill="#0f172a">Encrypted store</text>

    <!-- Note attached to the sync server -->
    <line x1="380" y1="500" x2="430" y2="500" stroke="#ca8a04" stroke-width="1.25" stroke-dasharray="5 4"/>
    <path d="M430 440 H978 L1000 462 V560 H430 Z" fill="#fefce8" stroke="#ca8a04" stroke-width="1.25" stroke-linejoin="round"/>
    <path d="M978 440 V462 H1000" fill="none" stroke="#ca8a04" stroke-width="1.25"/>
    <text x="456" y="478" font-size="12" fill="#422006">Nothing here is readable. Bots and settings are encrypted on your device</text>
    <text x="456" y="502" font-size="12" fill="#422006">before they are sent, and the key stays there &#8212; so this server only ever</text>
    <text x="456" y="526" font-size="12" fill="#422006">holds scrambled bytes it has no way to open.</text>

    <!-- Association: the app uses the Host -->
    <line x1="380" y1="200" x2="454" y2="200" stroke="#2563eb" stroke-width="1.75"/>
    <line x1="606" y1="200" x2="680" y2="200" stroke="#2563eb" stroke-width="1.75" marker-end="url(#open-blue)"/>
    <rect x="454" y="189" width="152" height="22" rx="11" fill="#eff6ff" stroke="#2563eb" stroke-width="1.25"/>
    <text x="530" y="204" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">chat, approve, control</text>

    <!-- Dependency: the app signs in and syncs -->
    <line x1="210" y1="270" x2="210" y2="345" stroke="#7c3aed" stroke-width="1.75" stroke-dasharray="7 5"/>
    <line x1="210" y1="367" x2="210" y2="430" stroke="#7c3aed" stroke-width="1.75" stroke-dasharray="7 5" marker-end="url(#open-violet)"/>
    <rect x="164" y="345" width="92" height="22" rx="11" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.25"/>
    <text x="210" y="360" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">sign in, sync</text>

  </g>
</svg>
