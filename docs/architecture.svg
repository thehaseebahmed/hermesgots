<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" width="1040" height="500" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">How Gots fits together</title>
  <desc id="diagram-desc">Your phone or tablet runs the Gots app. It chats with your own computer or server, where Hermes Agent and the Gots plugin run. If you use more than one device, an optional sync server keeps an encrypted copy.</desc>

  <defs>
    <marker id="arrow-blue-end" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-blue-start" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-violet-end" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-violet-start" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- The two links, drawn behind the cards, each broken by a small pill -->
  <line x1="380" y1="118" x2="494" y2="118" stroke="#2563eb" stroke-width="2" marker-start="url(#arrow-blue-start)"/>
  <line x1="546" y1="118" x2="660" y2="118" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue-end)"/>
  <rect x="494" y="107" width="52" height="22" rx="11" fill="#eff6ff" stroke="#2563eb" stroke-width="1.25"/>
  <text x="520" y="122" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1e40af">chat</text>

  <line x1="210" y1="195" x2="210" y2="241" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 5" marker-start="url(#arrow-violet-start)"/>
  <line x1="210" y1="263" x2="210" y2="310" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-violet-end)"/>
  <rect x="184" y="241" width="52" height="22" rx="11" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.25"/>
  <text x="210" y="256" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#5b21b6">sync</text>

  <!-- Card A: the app -->
  <rect x="40" y="40" width="340" height="155" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <g transform="translate(66,58)" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round">
    <rect x="0" y="0" width="26" height="42" rx="6"/>
    <rect x="4" y="6" width="18" height="25" rx="2.5" fill="#2563eb" fill-opacity="0.15" stroke="none"/>
    <line x1="9.5" y1="36" x2="16.5" y2="36" stroke-linecap="round"/>
  </g>
  <text x="110" y="76" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Your phone or tablet</text>
  <text x="110" y="96" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">The Gots app</text>
  <line x1="66" y1="112" x2="354" y2="112" stroke="#bfdbfe" stroke-width="1"/>
  <circle cx="70" cy="132" r="2.4" fill="#2563eb"/>
  <text x="82" y="136" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">Chat with your bots</text>
  <circle cx="70" cy="158" r="2.4" fill="#2563eb"/>
  <text x="82" y="162" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">Approve what they do</text>

  <!-- Card B: the Host -->
  <rect x="660" y="40" width="340" height="155" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <g transform="translate(686,58)" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round">
    <rect x="0" y="0" width="34" height="42" rx="4"/>
    <line x1="0" y1="14" x2="34" y2="14"/>
    <line x1="0" y1="28" x2="34" y2="28"/>
    <circle cx="8" cy="7" r="1.8" fill="#059669" stroke="none"/>
    <circle cx="8" cy="21" r="1.8" fill="#059669" stroke="none"/>
    <circle cx="8" cy="35" r="1.8" fill="#059669" stroke="none"/>
    <line x1="20" y1="7" x2="27" y2="7"/>
    <line x1="20" y1="21" x2="27" y2="21"/>
    <line x1="20" y1="35" x2="27" y2="35"/>
  </g>
  <text x="736" y="76" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Your computer or server</text>
  <text x="736" y="96" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">Hermes Agent + the Gots plugin</text>
  <line x1="686" y1="112" x2="974" y2="112" stroke="#a7f3d0" stroke-width="1"/>
  <circle cx="690" cy="132" r="2.4" fill="#059669"/>
  <text x="702" y="136" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">Your bots run here</text>
  <circle cx="690" cy="158" r="2.4" fill="#059669"/>
  <text x="702" y="162" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">Your files and history stay here</text>

  <!-- Card C: the sync server -->
  <rect x="40" y="310" width="340" height="155" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <g transform="translate(66,342)" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linejoin="round">
    <path d="M12.5 33 A 7.5 7.5 0 0 1 12.5 18 A 9.5 9.5 0 0 1 31 20.5 A 7 7 0 0 1 30 33 Z"/>
    <rect x="17" y="21" width="9" height="7" rx="1.5" fill="#7c3aed" stroke="none"/>
    <path d="M19 21 V18.5 A 2.5 2.5 0 0 1 24 18.5 V21" stroke-width="1.6"/>
  </g>
  <text x="110" y="352" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Gots' sync server</text>
  <text x="110" y="372" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">Optional, for two or more devices</text>
  <line x1="66" y1="388" x2="354" y2="388" stroke="#ddd6fe" stroke-width="1"/>
  <circle cx="70" cy="408" r="2.4" fill="#7c3aed"/>
  <text x="82" y="412" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">Signs you in</text>
  <circle cx="70" cy="434" r="2.4" fill="#7c3aed"/>
  <text x="82" y="438" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">Keeps an encrypted copy, and can't read it</text>
</svg>
