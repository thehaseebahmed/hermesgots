# A site of its own: set its base directory to website/ in Netlify, so this file is the one read.
# The app's netlify.toml at the repo root stays with the app site.
[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
