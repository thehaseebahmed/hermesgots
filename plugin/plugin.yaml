name: memento
version: "0.50.0"
description: Keeps the Gots app's chat list and context use, reads its chats' todo lists, serves it cron run history and Hermes Projects, creates projects with their GitHub repos cloned in, runs its project sessions in git worktrees with a permission mode, reads a project's GitHub tasks as AFK's frontier and holds AFK's switch for the project, gives the agent a tool that pushes its work and opens the pull request, resolves a session once its pull request merges, closes its pull request and branch when it is discarded, lets the agent ask the user questions, holds a chat's goal with Hermes's own /goal and keeps it going between runs, researches questions into cited guides, and labels its chats in Hermes.
author: Gots
# A research mission can be written with a model or provider other than the profile's, so the plugin
# asks Hermes to let it pick one. Hermes asks the user to grant these on install, update or
# `hermes plugins enable memento`.
capabilities:
  - llm.model_override
  - llm.provider_override
